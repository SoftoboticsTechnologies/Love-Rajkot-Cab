<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<script src="_ds/_ds_bundle.js"></script>
<link rel="stylesheet" href="site.css">
<style>
.trust-section{position:relative!important;overflow:hidden!important;min-height:clamp(360px,42vw,560px);display:flex;align-items:center}
.trust-section::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(10,17,31,.6),rgba(10,17,31,.6)),url("images/taxi.png");background-repeat:no-repeat;background-position:center 65%;background-size:cover;pointer-events:none}
.trust-section>[data-pad]{position:relative;z-index:1;width:100%}
</style>
</helmet>
<section class="trust-section" style="background:var(--color-text);color:var(--color-bg)">
  <div data-pad style="max-width:1440px;margin:0 auto;padding-top:clamp(48px,6vw,84px);padding-bottom:clamp(48px,6vw,84px);text-align:center">
    <h2 data-t="h1" style="margin:0">{{ kicker }}</h2>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:460},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { kicker: this.props.kicker ?? '' };
  }
}
</script>
</body>
</html>
