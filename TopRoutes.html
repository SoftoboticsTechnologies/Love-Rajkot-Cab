<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<script src="_ds/_ds_bundle.js"></script>
<link rel="stylesheet" href="site.css">
<style>
/* Routes component owns its card geometry so page themes cannot hide its specifications. */
.routes-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:18px!important;background:transparent!important;border:0!important}
.route-card{position:relative!important;display:flex!important;flex-direction:column!important;gap:14px!important;padding:22px!important;background:#fff!important;border:1px solid #e7edf3!important;border-radius:18px!important;box-shadow:0 6px 18px rgba(20,34,53,.06)!important;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease!important}
.route-card:hover{transform:translateY(-6px)!important;box-shadow:0 18px 34px rgba(20,34,53,.14)!important;border-color:rgba(255,199,44,.55)!important}
.route-top{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important}
.route-tag{display:inline-flex!important;padding:5px 10px!important;border-radius:999px!important;background:var(--color-accent-100)!important;color:var(--color-accent-700)!important;font-size:10.5px!important;font-weight:800!important;letter-spacing:.06em!important;text-transform:uppercase!important}
.route-popular{display:inline-flex!important;align-items:center!important;gap:4px!important;padding:5px 10px!important;border-radius:999px!important;background:#142235!important;color:#fff!important;font-size:10.5px!important;font-weight:800!important;letter-spacing:.04em!important;text-transform:uppercase!important}
.route-title{margin:0!important;font-size:18px!important;line-height:1.3!important;color:#142235!important}
.route-arrow{color:var(--color-accent-800)!important}
.route-meta{display:flex!important;align-items:center!important;gap:6px!important;margin:0!important;font-size:12.5px!important;color:#66768a!important}
.route-meta svg{flex:none!important;opacity:.7!important}
.route-fare-row{display:flex!important;align-items:baseline!important;justify-content:space-between!important;margin-top:auto!important;padding-top:14px!important;border-top:1px dashed #e7edf3!important}
.route-fare-label{font-size:10.5px!important;letter-spacing:.08em!important;text-transform:uppercase!important;font-weight:700!important;color:#94a3b8!important}
.route-fare{font-family:var(--font-heading)!important;font-weight:800!important;font-size:20px!important;letter-spacing:-.02em!important;color:var(--color-accent-800)!important}
.route-actions{display:flex!important;align-items:stretch!important;gap:8px!important}
.route-btn-quote{flex:1!important;min-width:0!important;padding:12px 14px!important;font-size:12px!important;letter-spacing:.05em!important;text-transform:uppercase!important;border-radius:12px!important;white-space:nowrap!important}
.route-btn-icon{flex:none!important;width:42px!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;border-radius:12px!important;border:1.5px solid #e7edf3!important;color:#66768a!important;background:#fff!important;transition:border-color .2s ease,color .2s ease!important}
.route-btn-icon:hover{border-color:var(--color-accent)!important;color:var(--color-accent-800)!important}
.route-btn-wa:hover{border-color:#25D366!important;color:#25D366!important}
@media(max-width:1000px){.routes-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:640px){.routes-grid{grid-template-columns:1fr!important}}
</style>
</helmet>
<div class="routes-grid">
  <sc-for list="{{ routes }}" as="r" hint-placeholder-count="12">
    <article class="route-card" data-reveal>
      <div class="route-top">
        <span class="route-tag">{{ r.tag }}</span>
        <sc-if value="{{ r.popular }}" hint-placeholder-val="{{ false }}">
          <span class="route-popular">&#9733; Popular</span>
        </sc-if>
      </div>
      <h4 class="route-title">{{ r.from }} <span class="route-arrow">&rarr;</span> {{ r.to }}</h4>
      <p class="route-meta">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11Z"></path><circle cx="12" cy="10" r="2.4"></circle></svg>
        {{ r.km }} &middot; {{ r.hrs }}
      </p>
      <div class="route-fare-row">
        <span class="route-fare-label">Starting fare</span>
        <span class="route-fare">{{ r.fare }}</span>
      </div>
      <div class="route-actions">
        <a href="{{ r.wa }}" target="_blank" rel="noopener" class="btn btn-primary route-btn-quote">Get Quote</a>
        <a href="tel:+918160260322" aria-label="Call for this route" class="btn route-btn-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"></path></svg>
        </a>
        <a data-wa href="{{ r.wa }}" target="_blank" rel="noopener" aria-label="WhatsApp about this route" class="btn route-btn-icon route-btn-wa">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.9-.95 1.09-.17.2-.35.21-.65.07-.3-.15-1.13-.42-2.15-1.33-.79-.71-1.32-1.58-1.47-1.88-.15-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.68-1.63-.93-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.03 1.01-1.03 2.46 0 1.45 1.05 2.85 1.2 3.05.15.2 2.06 3.28 5.06 4.47.71.28 1.26.45 1.69.58.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35Z"></path><path d="M12.02 2C6.5 2 2.03 6.47 2.03 11.99c0 1.76.46 3.42 1.27 4.86L2 22.5l5.79-1.51a9.94 9.94 0 0 0 4.23.95h.01c5.51 0 9.99-4.48 9.99-10S17.53 2 12.02 2Zm0 18.13h-.01a8.2 8.2 0 0 1-3.9-1l-.28-.16-3.44.9.92-3.35-.18-.29a8.1 8.1 0 0 1-1.25-4.34 8.15 8.15 0 0 1 8.15-8.14c2.18 0 4.22.85 5.76 2.39a8.09 8.09 0 0 1 2.38 5.76 8.15 8.15 0 0 1-8.15 8.14Z"></path></svg>
        </a>
      </div>
    </article>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:620}}">
const ROUTES = [
  ['Rajkot', 'Dwarka', '230 km', '4 h 15 m', '₹4,500', true],
  ['Rajkot', 'Somnath', '190 km', '3 h 45 m', '₹3,800', true],
  ['Rajkot', 'Ahmedabad', '215 km', '3 h 30 m', '₹4,200', true],
  ['Rajkot', 'Junagadh', '100 km', '2 h', '₹2,400', false],
  ['Rajkot', 'Porbandar', '185 km', '3 h 30 m', '₹3,700', false],
  ['Rajkot', 'Jamnagar', '90 km', '1 h 45 m', '₹2,200', false],
  ['Ahmedabad', 'Rajkot', '215 km', '3 h 30 m', '₹4,200', false],
  ['Somnath', 'Rajkot', '190 km', '3 h 45 m', '₹3,800', false],
  ['Junagadh', 'Rajkot', '100 km', '2 h', '₹2,400', false],
  ['Dwarka', 'Rajkot', '230 km', '4 h 15 m', '₹4,500', false],
  ['Rajkot', 'Bhuj', '250 km', '4 h 30 m', '₹4,900', false],
  ['Rajkot', 'Statue of Unity', '340 km', '5 h 45 m', '₹6,600', false],
];

class Component extends DCLogic {
  renderVals() {
    return {
      routes: ROUTES.map(([from, to, km, hrs, fare, popular]) => ({
        from, to, km, hrs, fare, popular,
        tag: from === 'Rajkot' ? 'One-way' : 'Return leg',
        wa: 'https://wa.me/918160260322?text=' + encodeURIComponent('Hi LOVE Rajkot Cab, I want a quote for ' + from + ' to ' + to + '.'),
      })),
    };
  }
}
</script>
</body>
</html>
