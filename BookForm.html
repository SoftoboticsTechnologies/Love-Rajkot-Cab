<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<script src="_ds/_ds_bundle.js"></script>
<link rel="stylesheet" href="site.css">
<style>
/* Booking card: keep styles local and specific so global hero rules don't leak in */
.premium-booking{
  width:min(100%,480px)!important;
  display:block!important;
  padding:40px!important;
  border:0!important;
  border-radius:24px!important;
  background:#fff!important;
  color:#17263a!important;
  box-shadow:0 22px 54px rgba(10,24,42,.18)!important;
  line-height:normal!important;
  transition:transform .25s ease,box-shadow .25s ease!important;
}
.premium-booking:hover{transform:translateY(-2px);box-shadow:0 22px 52px rgba(20,34,53,.17)!important}
.booking-widget-head{margin:0 0 22px!important}
.booking-widget-head h6{margin:0 0 9px!important;color:#000!important;background:transparent!important;font-size:12px!important;font-weight:700!important;line-height:1.2!important;letter-spacing:.12em!important;text-transform:uppercase!important}
.booking-widget-head h3{margin:0 0 12px!important;color:#0F172A!important;background:transparent!important;font-size:clamp(28px,3vw,38px)!important;font-weight:800!important;line-height:1.08!important;letter-spacing:-.02em!important}
.booking-widget-head p{margin:0!important;color:#64748B!important;background:transparent!important;font-size:16px!important;line-height:1.6!important;opacity:1!important}

.premium-booking form{display:grid!important;gap:20px!important;margin:0!important}
.premium-booking .booking-fields{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:18px!important}
.premium-booking .field{min-width:0!important}
.premium-booking .control{position:relative}
.premium-booking .field>label{display:block!important;margin:0 0 8px!important;color:#64748b!important;font-size:11px!important;font-weight:700!important;line-height:1.2!important;letter-spacing:.08em!important;text-transform:uppercase!important}

/* Icons inside inputs: absolutely positioned and vertically centered */
.premium-booking .field-icon{position:absolute!important;z-index:1;left:16px!important;top:50%!important;transform:translateY(-50%)!important;width:19px!important;height:19px!important;color:#9aa8b8!important;pointer-events:none!important;background:transparent!important}

/* Inputs: consistent height, padding to accommodate icon, rounded corners */
.premium-booking .input{display:block!important;width:100%!important;height:56px!important;min-height:56px!important;margin:0!important;padding:10px 14px 10px 52px!important;border:1px solid #dbe4ed!important;border-radius:14px!important;background:#f8fafc!important;color:#17263a!important;font-size:14px!important;line-height:1.3!important;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease!important}
.premium-booking .input::placeholder{color:#9aa8b8!important;opacity:1!important}
.premium-booking .input:hover{border-color:#6ea1fb!important;background:#fff!important}
.premium-booking .input:focus-visible{border-color:#2563eb!important;box-shadow:0 0 0 6px rgba(37,99,235,.10)!important;outline:0!important}
.premium-booking input[type="date"]{color:#64748b!important}

/* CTA: larger top gap, centered content, improved hover */
.premium-booking .btn-primary{width:100%!important;min-height:58px!important;margin:18px 0 0!important;border:0!important;border-radius:16px!important;background:linear-gradient(135deg,#3b82f6,#1d4ed8)!important;box-shadow:0 11px 22px rgba(29,78,216,.25)!important;font-size:13px!important;font-weight:800!important;line-height:1.2!important;letter-spacing:.09em!important;transition:transform .22s cubic-bezier(.2,.9,.2,1),box-shadow .22s cubic-bezier(.2,.9,.2,1)!important;display:flex!important;align-items:center;justify-content:center;gap:12px}
.premium-booking .btn-primary:hover{transform:translateY(-3px)!important;box-shadow:0 18px 34px rgba(29,78,216,.32)!important}

.premium-booking .booking-note{display:flex!important;align-items:flex-start!important;gap:9px!important;margin:0!important;color:#748397!important;background:transparent!important;font-size:12.5px!important;line-height:1.48!important;text-align:left!important;opacity:1!important}
.premium-booking .booking-note svg{width:17px!important;height:17px!important;flex:none!important;margin-top:1px!important;color:#3b76f2!important}
.premium-booking form>p a{color:#2563eb!important;font-weight:800!important}
.premium-booking .booking-assurance{display:flex!important;align-items:center!important;gap:8px!important;margin:-4px 0 0!important;color:#506177!important;font-size:12px!important;font-weight:600!important}
.premium-booking .booking-assurance span:first-child{display:inline-grid!important;place-items:center!important;width:19px!important;height:19px!important;border-radius:50%!important;background:#eaf7ef!important;color:#18844a!important;font-size:12px!important}

@media(max-width:600px){
  .premium-booking{padding:28px 24px!important;border-radius:20px!important}
  .booking-widget-head h3{font-size:29px!important}
  .premium-booking .booking-fields{grid-template-columns:1fr!important;gap:16px!important}
  .premium-booking .btn-primary{margin-top:4px!important}
}

.booking-thanks-overlay{position:fixed!important;inset:0!important;z-index:9999!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:20px!important;background:rgba(13,20,34,.6)!important;backdrop-filter:blur(4px)!important;animation:bookingThanksFade .22s ease!important}
.booking-thanks-card{position:relative!important;width:min(100%,420px)!important;background:#fff!important;color:#17263a!important;border-radius:22px!important;padding:40px 32px 32px!important;text-align:center!important;box-shadow:0 30px 70px rgba(8,15,30,.35)!important;animation:bookingThanksPop .28s cubic-bezier(.2,.9,.2,1)!important}
.booking-thanks-close{position:absolute!important;top:14px!important;right:14px!important;width:32px!important;height:32px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;border:0!important;border-radius:50%!important;background:#f1f5f9!important;color:#64748b!important;font-size:18px!important;line-height:1!important;cursor:pointer!important;transition:background .18s ease,color .18s ease!important}
.booking-thanks-close:hover{background:#e2e8f0!important;color:#17263a!important}
.booking-thanks-icon{display:grid!important;place-items:center!important;width:64px!important;height:64px!important;margin:0 auto 18px!important;border-radius:50%!important;background:linear-gradient(135deg,#3b82f6,#1d4ed8)!important;color:#fff!important;box-shadow:0 10px 22px rgba(29,78,216,.3)!important}
.booking-thanks-card h4{margin:0 0 10px!important;font-size:24px!important;font-weight:800!important;letter-spacing:-.01em!important;color:#0f172a!important}
.booking-thanks-lead{margin:0 0 12px!important;font-size:15px!important;font-weight:700!important;line-height:1.5!important;color:#1d4ed8!important}
.booking-thanks-sub{margin:0 0 8px!important;font-size:15px!important;font-weight:700!important;line-height:1.5!important;color:#0f172a!important}
.booking-thanks-note{margin:0!important;font-size:13px!important;line-height:1.6!important;color:#64748b!important}
@keyframes bookingThanksFade{from{opacity:0}to{opacity:1}}
@keyframes bookingThanksPop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</helmet>
<div class="premium-booking" style="background:var(--color-surface);color:var(--color-text);border:2px solid var(--color-text);padding:clamp(22px,2.6vw,34px)">
  <div class="booking-widget-head">
    <h6>{{ kicker }}</h6>
    <h3 data-t="h2">{{ heading }}</h3>
    <p>{{ note }}</p>
  </div>
  <form onSubmit="{{ submit }}">
    <div class="booking-fields">
      <div class="field">
        <label for="{{ idPickup }}">Pickup location</label>
        <div class="control">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10c0-4.4 3.6-8 8-8s8 3.6 8 8Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          <input class="input" id="{{ idPickup }}" name="pickup" required autocomplete="street-address" placeholder="e.g. Rajkot Railway Station">
        </div>
      </div>
      <div class="field">
        <label for="{{ idDrop }}">Drop location</label>
        <div class="control">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10c0-4.4 3.6-8 8-8s8 3.6 8 8Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          <input class="input" id="{{ idDrop }}" name="drop" required autocomplete="off" placeholder="e.g. Somnath Temple">
        </div>
      </div>
      <div class="field">
        <label for="{{ idPhone }}">Phone number</label>
        <div class="control">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"></path></svg>
          <input class="input" id="{{ idPhone }}" name="phone" type="tel" required inputmode="numeric" autocomplete="tel" pattern="[6-9][0-9]{9}" title="Enter a valid 10-digit Indian mobile number" placeholder="10-digit mobile number">
        </div>
      </div>
      <div class="field">
        <label for="{{ idDate }}">Pickup date</label>
        <div class="control">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
          <input class="input" id="{{ idDate }}" name="date" type="date" required aria-describedby="{{ idDate }}-help">
        </div>
      </div>
    </div>
    <div class="booking-assurance"><span aria-hidden="true">✓</span><span id="{{ idDate }}-help">Fare is confirmed with you before the trip starts.</span></div>
    <button type="submit" class="btn btn-primary" style="width:100%;padding:16px 20px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;gap:12px">
      {{ cta }}
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
    </button>
    <p class="booking-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.4 9.4 0 0 1-4-.9L3 21l1.5-4.4A8.3 8.3 0 0 1 3 12a8.5 8.5 0 0 1 8.7-8.5A8.5 8.5 0 0 1 21 11.5Z"></path><path d="M8 10.5c.5 2.1 1.7 3.4 4 4"></path></svg><span>Sends your trip details by email. Prefer to call? <a href="tel:+918160260322">+91 8160260322</a></span></p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:520},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book a ride&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book A Ride&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tell us where and when. Fixed fare confirmed before the trip starts.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Inquire Now&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  uid = 'bf' + Math.random().toString(36).slice(2, 8);
  submit = (e) => {
    e.preventDefault();
    if (!e.currentTarget.reportValidity()) return;
    const form = e.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    const f = new FormData(form);
    const g = (k) => (f.get(k) || '').toString().trim();
    if (submitBtn) submitBtn.disabled = true;
    const mailBody =
      'Pickup: ' + g('pickup') + '\n' +
      'Drop: ' + g('drop') + '\n' +
      'Date: ' + g('date') + '\n' +
      'Phone: ' + g('phone');
    window.location.href = 'mailto:Loverajkot05@gmail.com?subject=' + encodeURIComponent('New Taxi Booking Request') + '&body=' + encodeURIComponent(mailBody);
    fetch('https://formsubmit.co/ajax/Loverajkot05@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: 'New Taxi Booking Request',
        _template: 'table',
        Pickup: g('pickup'),
        Drop: g('drop'),
        Phone: g('phone'),
        Date: g('date'),
      }),
    })
      .catch((err) => { console.error('Booking email failed to send', err); })
      .then(() => {
        if (submitBtn) submitBtn.disabled = false;
        form.reset();
        this.showThanks();
      });
  };
  showThanks = () => {
    const overlay = document.createElement('div');
    overlay.className = 'booking-thanks-overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', 'Booking request sent');
    overlay.innerHTML =
      '<div class="booking-thanks-card">' +
        '<button type="button" class="booking-thanks-close" aria-label="Close">&times;</button>' +
        '<div class="booking-thanks-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></div>' +
        '<h4>Thank You!</h4>' +
        '<p class="booking-thanks-lead">Your booking request is ready to send on email.</p>' +
        '<p class="booking-thanks-sub">We&#39;ll call you back shortly.</p>' +
        '<p class="booking-thanks-note">Usually within ten minutes, day or night. Nothing is charged until you agree the fare.</p>' +
      '</div>';
    const close = () => overlay.remove();
    overlay.addEventListener('click', (ev) => { if (ev.target === overlay) close(); });
    overlay.querySelector('.booking-thanks-close').addEventListener('click', close);
    document.body.appendChild(overlay);
  };
  renderVals() {
    return {
      kicker: this.props.kicker ?? 'Book a ride',
      heading: this.props.heading ?? 'Book A Ride',
      note: this.props.note ?? 'Tell us where and when. Fixed fare confirmed before the trip starts.',
      cta: this.props.cta ?? 'Inquire Now',
      idPickup: this.uid + '-pickup',
      idDrop: this.uid + '-drop',
      idPhone: this.uid + '-phone',
      idDate: this.uid + '-date',
      submit: this.submit,
    };
  }
}
</script>
</body>
</html>
